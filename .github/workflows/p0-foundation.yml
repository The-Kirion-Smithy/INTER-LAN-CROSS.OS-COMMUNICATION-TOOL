name: P0 Foundation

on:
  push:
    branches:
      - main
      - KIRCH-INTERLAN-P0-FOUNDATION
  pull_request:
    branches:
      - main

jobs:
  dotnet:
    name: .NET 10 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore InterLan.sln
      - run: dotnet build InterLan.sln --configuration Release --no-restore
      - run: dotnet run --project tools/InterLan.FoundationChecks/InterLan.FoundationChecks.csproj --configuration Release --no-build

  web:
    name: Android web-client shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - working-directory: web-client
        run: npm install
      - working-directory: web-client
        run: npm run build
      - name: Test web output verification
        run: node --test tools/InterLan.WebAssetChecks/verify.test.mjs
      - name: Assert bundled server-hosted web assets
        run: node tools/InterLan.WebAssetChecks/verify.mjs src/InterLan.Server/wwwroot/client
